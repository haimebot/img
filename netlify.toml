[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/proxy-img"
  to = "/.netlify/functions/proxy-image"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
