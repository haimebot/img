services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: amazon-image-viewer:latest
    container_name: amazon-image-viewer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Optional: custom API keys (or pass via .env file)
      # - IMGBB_API_KEY=
      # - REMOVE_BG_API_KEY=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
